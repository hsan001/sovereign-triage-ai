[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stcai"
version = "0.1.0"
description = "Sovereign-Triage & Compliance AI (S-TCAI) aligned with DESC ISR v2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.2",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
